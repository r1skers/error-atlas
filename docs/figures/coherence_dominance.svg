<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial" font-size="13"><rect x="0" y="0" width="720" height="450" fill="#ffffff"/><text x="70" y="30" font-size="17" font-weight="700" fill="#1b2430">Coherence dominates tree-to-tree error variation</text><text x="70" y="50" fill="#6b7684">Std. dev. across 32 trees per input, width 256. E² = A (local energy) + C (sign coherence).</text><rect x="70" y="70" width="12" height="12" fill="#7c8aa5" rx="2"/><text x="88" y="81" fill="#1b2430">std(A) local energy</text><rect x="235" y="70" width="12" height="12" fill="#e06c5a" rx="2"/><text x="253" y="81" fill="#1b2430">std(C) sign coherence</text><line x1="70" y1="376.0" x2="696" y2="376.0" stroke="#e7eaee" stroke-width="1"/><text x="62" y="380.0" text-anchor="end" fill="#6b7684" font-size="11">0.0</text><line x1="70" y1="308.0" x2="696" y2="308.0" stroke="#e7eaee" stroke-width="1"/><text x="62" y="312.0" text-anchor="end" fill="#6b7684" font-size="11">1.8</text><line x1="70" y1="240.0" x2="696" y2="240.0" stroke="#e7eaee" stroke-width="1"/><text x="62" y="244.0" text-anchor="end" fill="#6b7684" font-size="11">3.7</text><line x1="70" y1="172.0" x2="696" y2="172.0" stroke="#e7eaee" stroke-width="1"/><text x="62" y="176.0" text-anchor="end" fill="#6b7684" font-size="11">5.5</text><line x1="70" y1="104.0" x2="696" y2="104.0" stroke="#e7eaee" stroke-width="1"/><text x="62" y="108.0" text-anchor="end" fill="#6b7684" font-size="11">7.4</text><text x="18" y="240" fill="#6b7684" font-size="11" transform="rotate(-90 18 240)" text-anchor="middle">std. dev.  (×10⁻¹⁰)</text><rect x="98.3" y="322.9" width="46.9" height="53.1" fill="#7c8aa5" rx="2"/><rect x="151.2" y="188.5" width="46.9" height="187.5" fill="#e06c5a" rx="2"/><text x="148.2" y="180.5" text-anchor="middle" fill="#1b2430" font-size="12" font-weight="700">3.5×</text><text x="148.2" y="396.0" text-anchor="middle" fill="#6b7684" font-size="11">seed 1</tex